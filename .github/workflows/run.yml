name: arXiv-crawl

on:
  schedule:
    - cron: "30 1 * * *"

  workflow_dispatch:


permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # ======================================================
      # Dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync


      # ======================================================
      # Crawl arXiv
      # ======================================================

      - name: Crawl arXiv papers via Official API
        id: crawl_step

        run: |
          set -euo pipefail

          source .venv/bin/activate

          today=$(date -u "+%Y-%m-%d")

          echo "========================================"
          echo "arXiv Daily Crawl"
          echo "Date: $today"
          echo "========================================"

          cd daily_arxiv

          export OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
          export OPENAI_BASE_URL="${{ secrets.OPENAI_BASE_URL }}"
          export TOKEN_GITHUB="${{ secrets.TOKEN_GITHUB }}"

          export LANGUAGE="${{ vars.LANGUAGE }}"
          export CATEGORIES="${{ vars.CATEGORIES }}"
          export MODEL_NAME="${{ vars.MODEL_NAME }}"

          export TODAY="$today"


          # ------------------------------------------
          # Validate configuration
          # ------------------------------------------

          if [ -z "$CATEGORIES" ]; then
              echo "ERROR: CATEGORIES repository variable is empty."
              exit 1
          fi

          echo "Categories: $CATEGORIES"


          # ------------------------------------------
          # Run crawler
          # ------------------------------------------

          python ../.github/workflows/CrawlArxiv.py


          # ------------------------------------------
          # Validate output
          # ------------------------------------------

          DATA_FILE="../data/${today}.jsonl"

          if [ ! -f "$DATA_FILE" ]; then

              echo "ERROR:"
              echo "Crawler did not generate:"
              echo "$DATA_FILE"

              exit 1

          fi


          paper_count=$(wc -l < "$DATA_FILE")

          echo "Fetched papers: $paper_count"


          # ------------------------------------------
          # Safety guard
          # ------------------------------------------

          if [ "$paper_count" -gt 2000 ]; then

              echo "ERROR:"
              echo "Abnormally large number of papers:"
              echo "$paper_count"

              echo "Stopping workflow to prevent"
              echo "unexpected AI API usage."

              exit 1

          fi


          # ------------------------------------------
          # GitHub outputs
          # ------------------------------------------

          echo "crawl_date=$today" >> "$GITHUB_OUTPUT"
          echo "paper_count=$paper_count" >> "$GITHUB_OUTPUT"


          if [ "$paper_count" -eq 0 ]; then

              echo "No papers found for $today."

              echo "has_papers=false" >> "$GITHUB_OUTPUT"

          else

              echo "has_papers=true" >> "$GITHUB_OUTPUT"

          fi

          echo "Crawl completed successfully."


      # ======================================================
      # AI Enhancement
      # ======================================================

      - name: AI Enhancement Processing

        if: steps.crawl_step.outputs.has_papers == 'true'

        run: |
          set -euo pipefail

          source .venv/bin/activate

          today="${{ steps.crawl_step.outputs.crawl_date }}"

          echo "Starting AI enhancement..."

          cd ai

          export OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
          export OPENAI_BASE_URL="${{ secrets.OPENAI_BASE_URL }}"

          export LANGUAGE="${{ vars.LANGUAGE }}"
          export MODEL_NAME="${{ vars.MODEL_NAME }}"

          python enhance.py \
            --data "../data/${today}.jsonl"

          echo "AI enhancement completed."


      # ======================================================
      # Markdown
      # ======================================================

      - name: Convert to Markdown

        if: steps.crawl_step.outputs.has_papers == 'true'

        run: |
          set -euo pipefail

          source .venv/bin/activate

          today="${{ steps.crawl_step.outputs.crawl_date }}"

          export LANGUAGE="${{ vars.LANGUAGE }}"

          cd to_md

          AI_FILE="../data/${today}_AI_enhanced_${LANGUAGE}.jsonl"

          if [ ! -f "$AI_FILE" ]; then

              echo "ERROR:"
              echo "AI enhanced file not found:"
              echo "$AI_FILE"

              exit 1

          fi

          python convert.py \
            --data "$AI_FILE"

          echo "Markdown conversion completed."


      # ======================================================
      # File list
      # ======================================================

      - name: Update file list

        if: steps.crawl_step.outputs.has_papers == 'true'

        run: |
          set -euo pipefail

          mkdir -p assets

          find data \
            -maxdepth 1 \
            -type f \
            -name "*.jsonl" \
            -printf "%f\n" \
            | sort \
            > assets/file-list.txt

          echo "File list updated."


      # ======================================================
      # Authentication
      # ======================================================

      - name: Generate password hash and inject into config

        if: steps.crawl_step.outputs.has_papers == 'true'

        run: |
          set -euo pipefail

          echo "Generating password hash..."

          PASSWORD="${{ secrets.ACCESS_PASSWORD }}"

          if [ -z "$PASSWORD" ]; then

              echo "ACCESS_PASSWORD is not configured."

              PASSWORD_HASH="DISABLED_NO_PASSWORD_SET_IN_SECRETS"

          else

              PASSWORD_HASH=$(
                  echo -n "$PASSWORD" \
                  | openssl dgst -sha256 -hex \
                  | awk '{print $2}'
              )

              echo "Password protection enabled."

          fi


          if [ ! -f "js/auth-config.js" ]; then

              echo "ERROR: js/auth-config.js not found."

              exit 1

          fi


          sed -i \
            "s/PLACEHOLDER_PASSWORD_HASH/$PASSWORD_HASH/" \
            js/auth-config.js

          echo "Authentication configuration completed."


      # ======================================================
      # Repository configuration
      # ======================================================

      - name: Inject repository info into data-config.js

        if: steps.crawl_step.outputs.has_papers == 'true'

        run: |
          set -euo pipefail

          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"


          if [ ! -f "js/data-config.js" ]; then

              echo "ERROR: js/data-config.js not found."

              exit 1

          fi


          sed -i \
            "s/PLACEHOLDER_REPO_OWNER/$REPO_OWNER/g" \
            js/data-config.js

          sed -i \
            "s/PLACEHOLDER_REPO_NAME/$REPO_NAME/g" \
            js/data-config.js

          echo "Repository information injected."


      # ======================================================
      # Commit main branch changes
      # ======================================================

      - name: Commit code changes to main branch

        if: steps.crawl_step.outputs.has_papers == 'true'

        run: |
          set -euo pipefail

          git config --global user.email "${{ vars.EMAIL }}"
          git config --global user.name "${{ vars.NAME }}"


          git add js/data-config.js
          git add js/auth-config.js


          if git diff --staged --quiet; then

              echo "No code changes to commit."

          else

              git commit \
                -m "chore: update generated configuration"

          fi


      # ======================================================
      # Push main
      # ======================================================

      - name: Push code changes to main branch

        if: steps.crawl_step.outputs.has_papers == 'true'

        run: |
          set -euo pipefail

          if git diff HEAD origin/main --quiet 2>/dev/null; then

              echo "No main branch changes to push."

          else

              git push origin HEAD:main

          fi


      # ======================================================
      # Save data before switching branch
      # ======================================================

      - name: Prepare data files for data branch

        if: steps.crawl_step.outputs.has_papers == 'true'

        run: |
          set -euo pipefail

          rm -rf /tmp/data_files

          mkdir -p /tmp/data_files/data
          mkdir -p /tmp/data_files/assets


          cp -r data/. \
            /tmp/data_files/data/


          if [ -f "assets/file-list.txt" ]; then

              cp assets/file-list.txt \
                /tmp/data_files/assets/

          fi

          echo "Data files prepared."


      # ======================================================
      # Data branch
      # ======================================================

      - name: Setup and commit to data branch

        if: steps.crawl_step.outputs.has_papers == 'true'

        run: |
          set -euo pipefail

          git config --global user.email "${{ vars.EMAIL }}"
          git config --global user.name "${{ vars.NAME }}"

          today="${{ steps.crawl_step.outputs.crawl_date }}"


          # ------------------------------------------
          # Clean working tree
          # ------------------------------------------

          git reset --hard HEAD
          git clean -fd


          # ------------------------------------------
          # Fetch data branch
          # ------------------------------------------

          if git ls-remote \
              --exit-code \
              --heads \
              origin \
              data >/dev/null 2>&1
          then

              echo "Existing data branch found."

              git fetch origin data

              git checkout -B data origin/data

          else

              echo "Creating new data branch."

              git checkout --orphan data

              git rm -rf . || true

              mkdir -p data
              mkdir -p assets

              echo "# Data Branch" > README.md

              git add README.md

              git commit \
                -m "chore: initialize data branch"

          fi


          # ------------------------------------------
          # Restore generated data
          # ------------------------------------------

          mkdir -p data
          mkdir -p assets


          cp -r /tmp/data_files/data/. \
            data/


          if [ -f "/tmp/data_files/assets/file-list.txt" ]; then

              cp \
                /tmp/data_files/assets/file-list.txt \
                assets/file-list.txt

          fi


          # ------------------------------------------
          # Commit
          # ------------------------------------------

          git add data/
          git add assets/file-list.txt


          if git diff --staged --quiet; then

              echo "No data changes to commit."

          else

              git commit \
                -m "update: $today arXiv papers"

          fi


      # ======================================================
      # Push data
      # ======================================================

      - name: Push data changes to data branch

        if: steps.crawl_step.outputs.has_papers == 'true'

        run: |
          set -euo pipefail

          git push origin data


      # ======================================================
      # Summary
      # ======================================================

      - name: Summary

        if: always()

        run: |

          echo "========================================"
          echo "arXiv workflow summary"
          echo "========================================"

          echo "Date:"
          echo "${{ steps.crawl_step.outputs.crawl_date }}"

          echo "Papers:"
          echo "${{ steps.crawl_step.outputs.paper_count }}"

          echo "========================================"
